spring.application.name=employee-management-standard-projects

spring.datasource.url=jdbc:mysql://localhost:3306/sprk_emp?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show.sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=C:/uploads

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.root=INFO


logging.level.com.sprk.employee_management=DEBUG

logging.file.name=logs/app.log



